<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Account Login</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; color: #1e293b; }
    button { cursor: pointer; padding: 6px 12px; margin: 4px; }
    input { padding: 6px; margin: 4px; }
  </style>
</head>
<body>
<div><h2>Sign In with Email</h2><form id="login-form"><label for="email">Email address</label><input id="email" type="email" placeholder="user@example.com"/><label for="password">Password</label><input id="password" type="password"/><button id="login-submit" type="submit">Log In</button></form></div>
</body>
</html>
