<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Closed Shadow DOM</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; color: #1e293b; }
    button { cursor: pointer; padding: 6px 12px; margin: 4px; }
    input { padding: 6px; margin: 4px; }
  </style>
</head>
<body>
<div><h1>Shadow Closed</h1><custom-closed id="closed-host"></custom-closed></div><script>const host=document.getElementById('closed-host');const shadow=host.attachShadow({mode:'closed'});shadow.innerHTML='<p>Closed Content</p>';</script>
</body>
</html>
